   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="301.36464" y="78.985359" transform="rotate(-0 301.36464 78.985359)">Mô tả sản phẩm</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="546.82326" y="79.997937" transform="rotate(-0 546.82326 79.997937)">Tiêu đề email</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="792.28188" y="78.703016" transform="rotate(-0 792.28188 78.703016)">Kịch bản chốt sale</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(52.117197 219.600672)">Chỉ số tự động</text>
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(71.416103 232.607781)">có nguồn</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="104.997744" y="392.444406" transform="rotate(-0 104.997744 392.444406)">LLM-as-a-judge</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(82.774853 476.438828)">Chỉ số</text>
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(64.170635 488.706563)">kinh doanh</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 167.483875)">• Tiêu đề 50–60 ký tự</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 180.413797)">(Ahrefs)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 193.179187)">• Meta 120–156 ký tự</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 206.406687)">(Yoast)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 219.673797)">• ≥ 200 từ (Yoast, Tiki)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 233.080047)">• Từ khóa ở tiêu đề,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 245.645359)">đoạn đầu (Yoast)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 258.340672)">• Mật độ 0,5–3% (Yoast)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 271.515359)">• ROUGE-L, chrF++,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 285.063797)">BERTScore</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 180.179187)">• ≤ 9 từ, ≤ 60 ký tự</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 192.919187)">(Mailchimp)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 206.340672)">• 4–6 từ hoặc 21–40</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 219.179187)">ký tự (Omnisend)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 232.480828)">• ≤ 3 dấu câu, ≤ 1 emoji</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 244.919187)">(Mailchimp)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 258.245203)">• Không giả Re:/Fwd:</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 271.413797)">(Gmail)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 193.179187)">• Có lời kêu gọi</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 206.179187)">hành động (AIDA)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 219.480828)">• Bao phủ phản đối từ</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 232.179187)">đánh giá thật</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 245.267547)">• Tỷ lệ thuộc tính</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 258.179187)">không có căn cứ</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 386.255187)">• Tự nhiên, liên quan,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 399.556828)">thuyết phục, nhất quán</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 386.255187)">• Rõ ràng, gây tò mò,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 399.255187)">liên quan</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 380.221359)">• CTA, nhu cầu–lợi ích</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 393.056828)">(SPIN), xử lý phản đối,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 405.755187)">đúng sự thật</text>
   </g>
   <g id="text_13">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 474.773203)">• Đặc trưng của nhóm bán chạy</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(194.255424 488.011875)">(gạch đầu dòng, độ dài tên)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 475.357188)">• Độ trễ sinh</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(439.714044 488.112422)">(giây/sản phẩm)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 468.207187)">• Thời gian duyệt so với</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 482.006484)">viết mới (đề xuất đo</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1f4e79" transform="translate(685.172664 495.107031)">khi triển khai)</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle" x="479.88" y="23.824687" transform="rotate(-0 479.88 23.824687)">Khung đánh giá nội dung đa tầng</text>
  </g>
 </g>
